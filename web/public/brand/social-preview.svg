<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>DC-DB logo social preview</title>
  <desc>Blue gradient ribbon around three server layers with the DC-DB wordmark on black.</desc>
  <rect width="1280" height="640" fill="#0A0A0A"/>
  <g transform="translate(240 215.4248366013072) scale(2.6143790849673203)">
    <g transform="translate(0 5)"><svg x="0" y="0" width="64" height="64" viewBox="121 29 596 724" preserveAspectRatio="xMidYMid meet"><defs>
    <linearGradient id="ribbon" x1="200" y1="95" x2="680" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26C8EB" />
      <stop offset=".4" stop-color="#0071F1" />
      <stop offset="1" stop-color="#0836E9" />
    </linearGradient>
    <linearGradient id="ribbon-side" x1="500" y1="300" x2="690" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0924CA" />
      <stop offset="1" stop-color="#063AEF" />
    </linearGradient>
    <linearGradient id="server-side" x1="141" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8D8F8" />
      <stop offset=".52" stop-color="#6395F6" />
      <stop offset="1" stop-color="#123EF2" />
    </linearGradient>
    <linearGradient id="server-bottom" x1="140" y1="560" x2="697" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4CEF8" />
      <stop offset=".38" stop-color="#6A98F8" />
      <stop offset=".72" stop-color="#153DF0" stop-opacity=".8" />
      <stop offset="1" stop-color="#153DF0" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="server-top" x1="215" y1="230" x2="330" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3DCFC" />
      <stop offset=".57" stop-color="#F7FAFF" />
      <stop offset="1" stop-color="#E8F1FF" />
    </linearGradient>
    <linearGradient id="lower-top" x1="260" y1="408" x2="290" y2="503" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8D3FC" />
      <stop offset=".75" stop-color="#F7FAFF" />
      <stop offset="1" stop-color="#DAEAFE" />
    </linearGradient>
  </defs>
