  <title>DC-DB</title>
  <desc>Central server chassis with three grayscale horizontal bars. Black or white background follows the theme.</desc>
  <style>.dc-db-mark{color:#171717;--brand-mark-bg:#ffffff;--brand-mark-mid:#808080;--brand-mark-soft:#b3b3b3}@media(prefers-color-scheme:dark){.dc-db-mark{color:#fafafa;--brand-mark-bg:#000000;--brand-mark-mid:#b3b3b3;--brand-mark-soft:#808080}}</style>
  <symbol id="dc-db-symbol" viewBox="0 0 64 64"><rect width="64" height="64" fill="var(--brand-mark-bg, #ffffff)"/><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(2.666666667)"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8" stroke-width="2.5" stroke="currentColor"/><path d="M8 12h8" stroke-width="2.5" stroke="var(--brand-mark-mid, #808080)"/><path d="M8 16h8" stroke-width="2.5" stroke="var(--brand-mark-soft, #b3b3b3)"/></g></symbol>
  <use href="#dc-db-symbol"/>
</svg>
